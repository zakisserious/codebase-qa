<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; }
#graph { width: 100%; height: 100vh; }
#stats { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 12px 16px; border-radius: 8px; font-size: 12px; line-height: 1.6; }
#stats h3 { margin-bottom: 6px; font-size: 14px; }
.tooltip { position: absolute; background: rgba(0,0,0,0.85); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 12px; pointer-events: none; display: none; max-width: 300px; }
</style>
</head>
<body>
<div id="stats"></div>
<div id="graph"></div>
<div class="tooltip" id="tooltip"></div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const data = __GRAPH_DATA__;
const colors = { python: "#3572A5", javascript: "#f1e05a", test: "#e8915a", docs: "#4a9e4a", config: "#8b8b8b", other: "#666" };
const width = window.innerWidth;
const height = window.innerHeight;

const statsDiv = document.getElementById("stats");
statsDiv.innerHTML = `<h3>Dependency Graph</h3>Files: ${data.stats.total_nodes} | Dependencies: ${data.stats.total_edges}` +
  (data.stats.most_imported.length ? "<br>Most imported: " + data.stats.most_imported.map(n => n.name + " (" + n.count + ")").join(", ") : "") +
  (data.stats.orphan_files.length ? "<br>Orphan files: " + data.stats.orphan_files.length : "");

const svg = d3.select("#graph").append("svg").attr("width", width).attr("height", height);
const g = svg.append("g");

svg.call(d3.zoom().scaleExtent([0.1, 4]).on("zoom", (e) => g.attr("transform", e.transform)));

const defs = svg.append("defs");
defs.append("marker").attr("id", "arrow").attr("viewBox", "0 -5 10 10").attr("refX", 20).attr("refY", 0)
  .attr("markerWidth", 6).attr("markerHeight", 6).attr("orient", "auto")
  .append("path").attr("d", "M0,-5L10,0L0,5").attr("fill", "#666");

const simulation = d3.forceSimulation(data.nodes)
  .force("link", d3.forceLink(data.links).id(d => d.id).distance(100))
  .force("charge", d3.forceManyBody().strength(-200))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(30));

const link = g.append("g").selectAll("line").data(data.links).join("line")
  .attr("stroke", "#555").attr("stroke-width", 1).attr("marker-end", "url(#arrow)");

const node = g.append("g").selectAll("g").data(data.nodes).join("g")
  .call(d3.drag().on("start", dragStart).on("drag", dragging).on("end", dragEnd));

node.append("circle").attr("r", d => Math.max(5, Math.min(15, Math.sqrt(d.lines / 10))))
  .attr("fill", d => colors[d.type] || colors.other).attr("stroke", "#333").attr("stroke-width", 1.5);

node.append("text").text(d => d.name).attr("dx", 12).attr("dy", 4).attr("font-size", 10).attr("fill", "#ccc");

const tooltip = document.getElementById("tooltip");
node.on("mouseover", (e, d) => {
  tooltip.style.display = "block";
  tooltip.innerHTML = `<b>${d.id}</b><br>Lines: ${d.lines} | Type: ${d.type}<br>In-degree: ${d.in_degree}`;
}).on("mousemove", (e) => {
  tooltip.style.left = (e.pageX + 10) + "px";
  tooltip.style.top = (e.pageY - 10) + "px";
}).on("mouseout", () => { tooltip.style.display = "none"; });

simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});

function dragStart(e, d) { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dragging(e, d) { d.fx = e.x; d.fy = e.y; }
function dragEnd(e, d) { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }
</script>
</body>
</html>
